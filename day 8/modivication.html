<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--konten-->
    <div id="myDiv">hallo word</div>
    <!--atribut-->
    <img id="myImage" src="../imge/gambar kiko.jpg" alt="pingwin">
    <!--css-->
    <div id="myDiv" style="width: 100px; height: 100px; background-color: antiquewhite;">
        contoh element
    </div>

    <script>
        //mengubah konten id myDiv
        let myDiv = document.getElementById('myDiv');
        myDiv.textContent ='hallo, javascrip !';

        //mengubah atribut 'src' dari element gambar 
        document.getElementById("myImage").setAttribute("src", "../../imge/gambar kiko.jpg");
        document.getElementById("myImage").setAttribute("alt", "../../imge/gambar kiko.jpg");

        // mengubah properti css elemen
        let div = document.getElementById("myDiv");
        div.style.backgroundcolor = "lightgreen";
        div.style.width = "200px";
        div.style.height ="200px";
    </script>
</body>
</html>
