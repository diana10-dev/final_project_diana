<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Kontrol Lampu Menggunakan JavaScript</h2>

    <p>Tekan Tombol di bawah untuk menghidupkan atau mematikan lampu.</p>

    <button onclick="document.getElementById('myImage').src='../image/lampuhidup.jpg'">
        Nyalakan Lampu
    </button>

    <img id="myImage" src="../image/lampumati.jpg" style="width:100px">

    <button onclick="document.getElementById('myImage').src='../image/lampumati.jpg'">
        Matikan Lampu
    </button>
</body>
</html>
